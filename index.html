<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Modeler - Advanced .sou & .gltf Support</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #222; color: white; font-family: sans-serif; touch-action: none; }
        canvas { display: block; }
        #ui-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 12px;
            pointer-events: auto;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        button, label {
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background: #4CAF50;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
        }
        button:active, label:active { background: #45a049; }
        #file-input, #gltf-input { display: none; }
        .mode-btn { background: #2196F3; }
        .mode-btn.active { background: #ff9800; }
        .continuous-btn { background: #009688; }
        .continuous-btn.active { background: #00bcd4; }
        .history-btn { background: #607d8b; }
        .history-btn:active { background: #455a64; }
        #export-obj { background: #9c27b0; }
        #export-gltf { background: #e91e63; }
        
        #color-picker {
            padding: 0;
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: none;
        }
        #color-picker::-webkit-color-swatch-wrapper { padding: 0; }
        #color-picker::-webkit-color-swatch { border: 2px solid #fff; border-radius: 8px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/OBJExporter.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="ui-container">
        <input type="color" id="color-picker" value="#00ff00" title="色を選択">
        <button id="toggle-mode" class="mode-btn active">モード: 追加</button>
        <button id="toggle-continuous" class="continuous-btn active">連続配置: ON</button>
        <button id="undo-btn" class="history-btn">元に戻す</button>
        <button id="redo-btn" class="history-btn">やり直す</button>
        <button id="save-sou">.sou 保存</button>
        <label for="file-input">.sou 読込</label>
        <input type="file" id="file-input" accept=".sou">
        <label for="gltf-input">.gltf 読込</label>
        <input type="file" id="gltf-input" accept=".gltf">
        <button id="export-obj">.obj 出力</button>
        <button id="export-gltf">.gltf 最適化出力</button>
    </div>

    <script>
        let scene, camera, renderer, controls;
        let plane, rollOverMesh, rollOverMaterial;
        let objects = []; 
        let isAddMode = true;
        let isContinuousMode = true; // 連続配置モードのフラグ
        
        let isPointerDown = false;
        let lastPlacedPosition = new THREE.Vector3();
        let historyStack = [];
        let redoStack = [];

        const cubeGeo = new THREE.BoxGeometry(50, 50, 50);
        const colorPicker = document.getElementById('color-picker');
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf0f0f0);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 10000);
            camera.position.set(500, 800, 1300);
            camera.lookAt(0, 0, 0);

            const rollOverGeo = new THREE.BoxGeometry(50, 50, 50);
            rollOverMaterial = new THREE.MeshBasicMaterial({ color: colorPicker.value, opacity: 0.5, transparent: true });
            rollOverMesh = new THREE.Mesh(rollOverGeo, rollOverMaterial);
            scene.add(rollOverMesh);

            const gridHelper = new THREE.GridHelper(1000, 20);
            scene.add(gridHelper);

            const geometry = new THREE.PlaneGeometry(1000, 1000);
            geometry.rotateX(- Math.PI / 2);
            plane = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({ visible: false }));
            scene.add(plane);
            objects.push(plane);

            const ambientLight = new THREE.AmbientLight(0x606060);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff);
            directionalLight.position.set(1, 0.75, 0.5).normalize();
            scene.add(directionalLight);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            renderer.domElement.addEventListener('pointermove', onPointerMove);
            renderer.domElement.addEventListener('pointerdown', onPointerDown);
            renderer.domElement.addEventListener('pointerup', onPointerUp);
            renderer.domElement.addEventListener('pointerleave', onPointerUp);
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', onKeyDown);

            colorPicker.addEventListener('input', (e) => {
                rollOverMaterial.color.set(e.target.value);
            });

            // UIボタンイベント
            document.getElementById('toggle-mode').addEventListener('click', () => setMode(!isAddMode));
            document.getElementById('toggle-continuous').addEventListener('click', () => setContinuousMode(!isContinuousMode));
            document.getElementById('undo-btn').addEventListener('click', undo);
            document.getElementById('redo-btn').addEventListener('click', redo);
            document.getElementById('save-sou').addEventListener('click', saveSou);
            document.getElementById('file-input').addEventListener('change', loadSou);
            document.getElementById('gltf-input').addEventListener('change', loadGltf);
            document.getElementById('export-obj').addEventListener('click', exportObj);
            document.getElementById('export-gltf').addEventListener('click', exportGltf);
        }

        function setMode(addMode) {
            isAddMode = addMode;
            const toggleBtn = document.getElementById('toggle-mode');
            toggleBtn.innerText = isAddMode ? "モード: 追加" : "モード: 削除";
            toggleBtn.classList.toggle('active', isAddMode);
            rollOverMesh.visible = isAddMode;
        }

        // 連続配置ON/OFF切り替え関数
        function setContinuousMode(enabled) {
            isContinuousMode = enabled;
            const continuousBtn = document.getElementById('toggle-continuous');
            continuousBtn.innerText = isContinuousMode ? "連続配置: ON" : "連続配置: OFF";
            continuousBtn.classList.toggle('active', isContinuousMode);
        }

        function onPointerMove(event) {
            pointer.set((event.clientX / window.innerWidth) * 2 - 1, - (event.clientY / window.innerHeight) * 2 + 1);
            raycaster.setFromCamera(pointer, camera);
            const intersects = raycaster.intersectObjects(objects, false);
            
            if (intersects.length > 0) {
                const intersect = intersects[0];
                const targetPos = new THREE.Vector3();
                targetPos.copy(intersect.point).add(intersect.face.normal);
                targetPos.divideScalar(50).floor().multiplyScalar(50).addScalar(25);
                
                rollOverMesh.position.copy(targetPos);

                // 連続配置モードがONの場合のみドラッグ配置を実行
                if (isPointerDown && isAddMode && isContinuousMode) {
                    if (!targetPos.equals(lastPlacedPosition)) {
                        const alreadyExists = objects.some(obj => obj !== plane && obj.position.equals(targetPos));
                        if (!alreadyExists) {
                            const voxelMaterial = new THREE.MeshLambertMaterial({ color: colorPicker.value });
                            const voxel = new THREE.Mesh(cubeGeo, voxelMaterial);
                            voxel.position.copy(targetPos);
                            scene.add(voxel);
                            objects.push(voxel);
                            
                            pushHistory('add', voxel);
                            lastPlacedPosition.copy(targetPos);
                        }
                    }
                }
            }
        }

        function onPointerDown(event) {
            if (event.isPrimary === false) return;
            isPointerDown = true;
            
            pointer.set((event.clientX / window.innerWidth) * 2 - 1, - (event.clientY / window.innerHeight) * 2 + 1);
            raycaster.setFromCamera(pointer, camera);
            const intersects = raycaster.intersectObjects(objects, false);

            if (intersects.length > 0) {
                const intersect = intersects[0];

                if (isAddMode) {
                    const voxelMaterial = new THREE.MeshLambertMaterial({ color: colorPicker.value });
                    const voxel = new THREE.Mesh(cubeGeo, voxelMaterial);
                    voxel.position.copy(intersect.point).add(intersect.face.normal);
                    voxel.position.divideScalar(50).floor().multiplyScalar(50).addScalar(25);
                    
                    const alreadyExists = objects.some(obj => obj !== plane && obj.position.equals(voxel.position));
                    if (!alreadyExists) {
                        scene.add(voxel);
                        objects.push(voxel);
                        
                        pushHistory('add', voxel);
                        lastPlacedPosition.copy(voxel.position);
                    }
                } else {
                    if (intersect.object !== plane) {
                        const removedObj = intersect.object;
                        scene.remove(removedObj);
                        objects.splice(objects.indexOf(removedObj), 1);
                        
                        pushHistory('remove', removedObj);
                    }
                }
            }
        }

        function onPointerUp() {
            isPointerDown = false;
        }

        function onKeyDown(event) {
            switch (event.key.toLowerCase()) {
                case 'e': setMode(true); break;
                case 'q': setMode(false); break;
                case 'c': setContinuousMode(!isContinuousMode); break; // Cキーで連続配置切り替え
                case 'z': undo(); break;
                case 'y': redo(); break;
                case 'w': controls.target.z -= 25; camera.position.z -= 25; break;
                case 's': controls.target.z += 25; camera.position.z += 25; break;
                case 'a': controls.target.x -= 25; camera.position.x -= 25; break;
                case 'd': controls.target.x += 25; camera.position.x += 25; break;
            }
        }

        function pushHistory(type, object) {
            historyStack.push({ type: type, object: object });
            redoStack = []; 
        }

        function undo() {
            if (historyStack.length === 0) return;
            const action = historyStack.pop();
            if (action.type === 'add') {
                scene.remove(action.object);
                objects.splice(objects.indexOf(action.object), 1);
            } else if (action.type === 'remove') {
                scene.add(action.object);
                objects.push(action.object);
            }
            redoStack.push(action);
        }

        function redo() {
            if (redoStack.length === 0) return;
            const action = redoStack.pop();
            if (action.type === 'add') {
                scene.add(action.object);
                objects.push(action.object);
            } else if (action.type === 'remove') {
                scene.remove(action.object);
                objects.splice(objects.indexOf(action.object), 1);
            }
            historyStack.push(action);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // --- 保存・読み込み・出力システム ---

        function saveSou() {
            const dataToSave = objects
                .filter(obj => obj !== plane)
                .map(voxel => ({
                    x: voxel.position.x, y: voxel.position.y, z: voxel.position.z,
                    color: voxel.material.color.getHex()
                }));

            const jsonString = JSON.stringify(dataToSave);
            const blob = new Blob([jsonString], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = 'model.sou';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function loadSou(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const loadedData = JSON.parse(e.target.result);
                    
                    objects.forEach(obj => { if (obj !== plane) scene.remove(obj); });
                    objects = [plane];
                    historyStack = [];
                    redoStack = [];

                    loadedData.forEach(data => {
                        const mat = new THREE.MeshLambertMaterial({ color: data.color });
                        const voxel = new THREE.Mesh(cubeGeo, mat);
                        voxel.position.set(data.x, data.y, data.z);
                        scene.add(voxel);
                        objects.push(voxel);
                    });
                } catch (error) {
                    alert('ファイルの読み込みに失敗しました。');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function exportObj() {
            const exporter = new THREE.OBJExporter();
            const exportGroup = new THREE.Group();
            objects.forEach(obj => { if (obj !== plane) exportGroup.add(obj.clone()); });

            const result = exporter.parse(exportGroup);
            const blob = new Blob([result], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = 'model.obj';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function exportGltf() {
            const exporter = new THREE.GLTFExporter();
            const exportGroup = new THREE.Group();
            
            objects.forEach(obj => {
                if (obj !== plane) exportGroup.add(obj.clone());
            });

            exporter.parse(exportGroup, function (gltf) {
                const jsonString = JSON.stringify(gltf);
                const blob = new Blob([jsonString], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = 'model.gltf';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }, function (error) {
                console.error('GLTFの出力に失敗しました:', error);
            }, { binary: false });
        }

        // .gltf ファイルのインポート機能
        function loadGltf(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const contents = e.target.result;
                const loader = new THREE.GLTFLoader();
                
                // 現存するオブジェクト、履歴を一度クリア
                objects.forEach(obj => { if (obj !== plane) scene.remove(obj); });
                objects = [plane];
                historyStack = [];
                redoStack = [];

                // JSON文字列をGLTFLoaderでパース
                loader.parse(contents, '', function(gltf) {
                    const loadedGroup = gltf.scene;
                    const meshesToLoad = [];

                    // インポートされた階層構造からMeshのみを取り出す
                    loadedGroup.traverse(function(child) {
                        if (child.isMesh && child !== plane) {
                            meshesToLoad.push(child);
                        }
                    });

                    // 取り出したMeshを再編集可能な形式（MeshLambertMaterial）に最適化して配置
                    meshesToLoad.forEach(mesh => {
                        let originalColor = 0xffffff;
                        if (mesh.material && mesh.material.color) {
                            originalColor = mesh.material.color.getHex();
                        }
                        
                        const voxelMaterial = new THREE.MeshLambertMaterial({ color: originalColor });
                        const voxel = new THREE.Mesh(cubeGeo, voxelMaterial);
                        
                        // エクスポート時のワールド座標系を引き継ぐ
                        voxel.position.copy(mesh.position);
                        
                        scene.add(voxel);
                        objects.push(voxel);
                    });
                }, function(error) {
                    alert('.gltf ファイルのパースに失敗しました。正しいデータか確認してください。');
                    console.error(error);
                });
            };
            reader.readAsText(file);
            event.target.value = '';
        }
    </script>
</body>
</html>
